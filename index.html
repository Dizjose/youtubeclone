<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube clone</title>
  <link rel="icon" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header">
    <div class="header-left">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">
        <i class="fas fa-bars"></i>
      </button>

      <a href="#" class="logo">
        <img src="assets/images/youtube-logo.png" alt="YouTube logo">
        <h1> YouTube </h1>
      </a>
    </div>

    <div class="header-center">
      <div class="search-container">
        <input type="text" class="search-input" placeholder="Buscar" />
        <button class="search-btn">
          <i class="fas fa-search"></i>
        </button>
      </div>
      <button class="mic-btn">
        <i class="fas fa-microphone"></i>
      </button>
    </div>

    <div class="header-right">
      <button class="header-btn">
        <i class="fas fa-video"></i>
      </button>

      <button class="header-btn">
        <i class="fas fa-bell"></i>
      </button>

      <div class="profile-btn">J</div>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <a href="#" class="sidebar-item active">
        <i class="fas fa-home"></i>
        <span> Inicio </span>
      </a>

      <a href="#" class="sidebar-item">
        <i class=" fas fa-compass"></i>
        <span> Explorar </span>
      </a>

      <a href="#" class="sidebar-item">
        <i class="fas fa-play-circle"></i>
        <span> Shorts </span>
      </a>

      <a href="#" class="sidebar-item">
        <i class="fas fa-list"></i>
        <span> Suscripciones </span>
      </a>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <a href="#" class="sidebar-item">
        <i class="fas fa-folder"></i>
        <span> Libreria </span>
      </a>

      <a href="#" class="sidebar-item">
        <i class="fas fa-history"></i>
        <span> Historial </span>
      </a>

      <a href="#" class="sidebar-item">
        <i class="fas fa-clock"></i>
        <span> Ver más tarde </span>
      </a>

      <a href="#" class="sidebar-item">
        <i class="fas fa-thumbs-up"></i>
        <span> Videos con Likes </span>
      </a>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <div class="sidebar-title">Suscripciones</div>
      <a href="#" class="sidebar-item">
        <i class="fas fa-user-circle"></i>
        <span> Canal Tecnológico </span>
      </a>

      <a href="#" class="sidebar-item">
        <i class="fas fa-user-circle"></i>
        <span> Centro de Música </span>
      </a>

      <a href="#" class="sidebar-item">
        <i class="fas fa-user-circle"></i>
        <span> Zona de Juego </span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->

  <main class="main-content" id="main-content">
    <div class="category-tabs">
      <button class="category-tab active">Todo</button>
      <button class="category-tab">Videojuegos</button>
      <button class="category-tab">Música</button>
      <button class="category-tab">Tecnología</button>
      <button class="category-tab">Deportes</button>
      <button class="category-tab">Educación</button>
      <button class="category-tab">Comedia</button>
      <button class="category-tab">Noticias</button>
      <button class="category-tab">Ciencia</button>
      <button class="category-tab">Viajes</button>
    </div>


    <div class="video-grid" id="videoGrid">
      <!-- Contenedor dinámico donde se renderizan las tarjetas de video -->
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>

</html>
